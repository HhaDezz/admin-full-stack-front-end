# Hosted demo on Netlify: runs on built-in sample data, no back end needed.
# Optionally set VITE_APP_NAME in Site settings → Environment variables.
[build]
  command = "npm ci && npm run build:demo"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_DEMO_MODE = "true"
  VITE_SHOWCASE = "true"

# Single-page app: every path serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

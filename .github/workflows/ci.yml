name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Unit and component tests
        run: npm test
      - name: Build (demo mode, as deployed for the live demo)
        run: npm run build
        env:
          VITE_DEMO_MODE: 'true'
      - name: Bundle budget (first screen under 150 kB gzipped)
        run: npm run budget
      - name: Lighthouse
        run: npx --yes @lhci/cli@0.14.0 autorun
